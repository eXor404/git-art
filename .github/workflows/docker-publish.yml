name: Docker Build and Publish

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*', '*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,pattern=main,suffix=,latest=true
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Set lower case image name
        run: |
          echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            IMAGE="ghcr.io/${{ env.IMAGE_NAME_LC }}:${{ github.ref_name }}"
            # Per-run login dir: two deploys at once must not share credentials state.
            CONF="$(mktemp -d)"
            trap 'docker --config "$CONF" logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$CONF"' EXIT
            echo "${{ secrets.GITHUB_TOKEN }}" | docker --config "$CONF" login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull BEFORE touching the running container. If the pull fails, the
            # old version keeps serving and this job goes red instead of green.
            docker --config "$CONF" pull "$IMAGE"

            docker rm -f git-art >/dev/null 2>&1 || true
            docker run -d --name git-art -p 127.0.0.1:4444:4444 --restart unless-stopped "$IMAGE"

            # A green job must mean the new container is actually up.
            sleep 5
            [ "$(docker inspect -f '{{.State.Running}}' git-art)" = true ]

            docker image prune -f
